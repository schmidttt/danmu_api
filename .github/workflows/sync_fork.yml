name: Fork Sync Pull Request

on:
  schedule:
    - cron: "17 21 * * *" # 北京时间每天 05:17 左右，避开 GitHub Actions 整点高峰
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: fork-sync-${{ github.repository }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: huangxd-/danmu_api
  UPSTREAM_BRANCH: main
  SYNC_BRANCH_PREFIX: automation/upstream-

jobs:
  sync_with_upstream:
    name: Propose upstream sync
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.repository.fork

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          set -euo pipefail
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || \
            git remote set-url upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch --prune upstream "${UPSTREAM_BRANCH}"

      - name: Check for upstream changes
        id: updates
        run: |
          set -euo pipefail
          upstream_ref="upstream/${UPSTREAM_BRANCH}"

          if git merge-base --is-ancestor "${upstream_ref}" origin/main; then
            echo "has_changes=false" >> "${GITHUB_OUTPUT}"
            echo "No upstream changes need to be proposed."
            exit 0
          fi

          upstream_sha="$(git rev-parse "${upstream_ref}")"
          upstream_short_sha="${upstream_sha:0:12}"
          base_sha="$(git merge-base origin/main "${upstream_ref}")"
          sync_branch="${SYNC_BRANCH_PREFIX}${upstream_short_sha}"

          {
            echo "has_changes=true"
            echo "upstream_sha=${upstream_sha}"
            echo "upstream_short_sha=${upstream_short_sha}"
            echo "base_sha=${base_sha}"
            echo "sync_branch=${sync_branch}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check for an existing proposal
        id: existing
        if: steps.updates.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_BRANCH: ${{ steps.updates.outputs.sync_branch }}
        run: |
          set -euo pipefail
          pr_url="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --head "${SYNC_BRANCH}" \
            --json url \
            --jq '.[0].url // empty')"

          if [ -n "${pr_url}" ]; then
            {
              echo "exists=true"
              echo "url=${pr_url}"
            } >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Prepare upstream integration branch
        id: merge
        if: steps.updates.outputs.has_changes == 'true' && steps.existing.outputs.exists != 'true'
        env:
          SYNC_BRANCH: ${{ steps.updates.outputs.sync_branch }}
        run: |
          set -euo pipefail
          git switch -C "${SYNC_BRANCH}" origin/main

          if git merge --no-edit --no-ff "upstream/${UPSTREAM_BRANCH}"; then
            {
              echo "conflict=false"
              echo "head_sha=$(git rev-parse HEAD)"
            } >> "${GITHUB_OUTPUT}"
          else
            conflict_files="$(git diff --name-only --diff-filter=U)"
            git merge --abort
            echo "conflict=true" >> "${GITHUB_OUTPUT}"
            {
              echo "files<<EOF"
              printf '%s\n' "${conflict_files}"
              echo "EOF"
            } >> "${GITHUB_OUTPUT}"
          fi

      - name: Report merge conflicts
        if: steps.updates.outputs.has_changes == 'true' && steps.merge.outputs.conflict == 'true'
        env:
          BASE_SHA: ${{ steps.updates.outputs.base_sha }}
          UPSTREAM_SHA: ${{ steps.updates.outputs.upstream_sha }}
          CONFLICT_FILES: ${{ steps.merge.outputs.files }}
        run: |
          {
            echo "## Upstream sync requires manual conflict resolution"
            echo
            echo "- Reviewed merge base: \`${BASE_SHA}\`"
            echo "- Current upstream: \`${UPSTREAM_SHA}\`"
            echo "- Production branch was not changed."
            echo
            echo "### Conflicting files"
            echo
            echo '~~~text'
            printf '%s\n' "${CONFLICT_FILES}"
            echo '~~~'
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "::error title=Upstream merge conflict::Review the conflict list in the job summary. Production main was not changed."
          exit 1

      - name: Push automation branch
        if: steps.updates.outputs.has_changes == 'true' && steps.existing.outputs.exists != 'true' && steps.merge.outputs.conflict == 'false'
        env:
          SYNC_BRANCH: ${{ steps.updates.outputs.sync_branch }}
        run: |
          set -euo pipefail
          git fetch origin \
            "refs/heads/${SYNC_BRANCH}:refs/remotes/origin/${SYNC_BRANCH}" || true
          git push --force-with-lease origin \
            "HEAD:refs/heads/${SYNC_BRANCH}"

      - name: Create Draft upstream integration pull request
        id: pull_request
        if: steps.updates.outputs.has_changes == 'true' && steps.existing.outputs.exists != 'true' && steps.merge.outputs.conflict == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_SHA: ${{ steps.updates.outputs.base_sha }}
          UPSTREAM_SHA: ${{ steps.updates.outputs.upstream_sha }}
          UPSTREAM_SHORT_SHA: ${{ steps.updates.outputs.upstream_short_sha }}
          SYNC_BRANCH: ${{ steps.updates.outputs.sync_branch }}
        run: |
          set -euo pipefail
          commits_file="${RUNNER_TEMP}/upstream-commits.md"
          body_file="${RUNNER_TEMP}/upstream-sync-pr.md"

          git log \
            --format='- %h %s' \
            "${BASE_SHA}..upstream/${UPSTREAM_BRANCH}" \
            > "${commits_file}"

          {
            echo "@${GITHUB_REPOSITORY_OWNER}"
            echo
            echo "This Draft PR contains the complete upstream change set since the last integrated upstream commit."
            echo
            echo "- Upstream repository: \`${UPSTREAM_REPO}\`"
            echo "- Previous upstream base: \`${BASE_SHA}\`"
            echo "- Proposed upstream commit: \`${UPSTREAM_SHA}\`"
            echo "- Automation branch: \`${SYNC_BRANCH}\`"
            echo
            echo "## Upstream commits"
            echo
            cat "${commits_file}"
            echo
            echo "## Review requirements"
            echo
            echo "- Treat upstream behavior and architecture as the default."
            echo "- Re-adapt downstream security, reliability, matching, and performance patches where they still provide additional protection."
            echo "- Remove downstream implementations that upstream now supersedes."
            echo "- Do not merge until Node tests, Docker validation, Vercel Preview, and representative behavior checks pass."
            echo "- Production merging still requires explicit owner confirmation."
          } > "${body_file}"

          pr_url="$(gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head "${SYNC_BRANCH}" \
            --draft \
            --title "chore: integrate upstream ${UPSTREAM_SHORT_SHA}" \
            --assignee "${GITHUB_REPOSITORY_OWNER}" \
            --body-file "${body_file}")"

          {
            echo "url=${pr_url}"
            echo "number=$(gh pr view "${pr_url}" --repo "${GITHUB_REPOSITORY}" --json number --jq '.number')"
          } >> "${GITHUB_OUTPUT}"

      - name: Dispatch branch validation workflows
        id: validation
        if: steps.pull_request.outputs.url != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_BRANCH: ${{ steps.updates.outputs.sync_branch }}
          HEAD_SHA: ${{ steps.merge.outputs.head_sha }}
        run: |
          set -euo pipefail
          workflows=(test.yml docker-image.yml)
          declare -A run_ids

          for workflow in "${workflows[@]}"; do
            gh workflow run "${workflow}" \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${SYNC_BRANCH}"

            run_id=""
            for attempt in {1..45}; do
              run_id="$(gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow "${workflow}" \
                --branch "${SYNC_BRANCH}" \
                --event workflow_dispatch \
                --limit 20 \
                --json databaseId,headSha \
                --jq ".[] | select(.headSha == \"${HEAD_SHA}\") | .databaseId" | head -n 1)"
              if [ -n "${run_id}" ]; then
                break
              fi
              sleep 2
            done

            if [ -z "${run_id}" ]; then
              echo "Could not locate the dispatched ${workflow} run." >&2
              exit 1
            fi

            run_ids["${workflow}"]="${run_id}"
          done

          for workflow in "${workflows[@]}"; do
            gh run watch "${run_ids[$workflow]}" \
              --repo "${GITHUB_REPOSITORY}" \
              --exit-status
          done

          {
            echo "test_run_id=${run_ids[test.yml]}"
            echo "docker_run_id=${run_ids[docker-image.yml]}"
          } >> "${GITHUB_OUTPUT}"

      - name: Record successful proposal
        if: steps.pull_request.outputs.url != '' && steps.validation.outcome == 'success'
        env:
          PR_URL: ${{ steps.pull_request.outputs.url }}
          UPSTREAM_SHA: ${{ steps.updates.outputs.upstream_sha }}
          TEST_RUN_ID: ${{ steps.validation.outputs.test_run_id }}
          DOCKER_RUN_ID: ${{ steps.validation.outputs.docker_run_id }}
        run: |
          {
            echo "## Draft upstream proposal created"
            echo
            echo "- Pull request: ${PR_URL}"
            echo "- Upstream commit: \`${UPSTREAM_SHA}\`"
            echo "- Node validation: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${TEST_RUN_ID}"
            echo "- Docker validation: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${DOCKER_RUN_ID}"
            echo "- Review Vercel Preview separately before any merge."
            echo "- Production main was not changed."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Record existing proposal
        if: steps.existing.outputs.exists == 'true'
        env:
          PR_URL: ${{ steps.existing.outputs.url }}
          UPSTREAM_SHA: ${{ steps.updates.outputs.upstream_sha }}
        run: |
          {
            echo "## Existing upstream proposal"
            echo
            echo "- Pull request: ${PR_URL}"
            echo "- Upstream commit: \`${UPSTREAM_SHA}\`"
            echo "- The automation branch was not overwritten."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Record no-change result
        if: steps.updates.outputs.has_changes != 'true'
        run: |
          {
            echo "## Fork is aligned with upstream"
            echo
            echo "The current upstream commit is already an ancestor of production main."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Report unexpected workflow failure
        if: failure() && steps.merge.outputs.conflict != 'true'
        continue-on-error: true
        run: |
          {
            echo "## Upstream sync workflow failed"
            echo
            echo "Review the failed step in this run."
            echo
            echo "No automatic merge into production main was performed."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error title=Upstream sync workflow failed::Review the failed step. Production main was not changed."
