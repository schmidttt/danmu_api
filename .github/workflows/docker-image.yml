name: Build and Push Docker Image to Docker Hub

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-validation-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Validate each architecture natively; QEMU can SIGILL during Alpine Node installs.
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Docker image without publishing
        run: |
          docker buildx build --platform ${{ matrix.platform }} \
            -t danmu-api:validation --load .
      - name: Smoke-test image imports
        run: docker run --rm --entrypoint node danmu-api:validation --input-type=module -e "await import('./danmu_api/worker.js')"

  build:
    # Publishing remains limited to upstream main; fork PRs use native validation above.
    if: github.event_name == 'push' && github.repository == 'huangxd-/danmu_api'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v6

      # 从 danmu_api/configs/globals.js 中读取版本号
      - name: Read version from globals.js
        id: version
        run: |
          VERSION=$(grep "VERSION:" danmu_api/configs/globals.js | sed -E "s/.*VERSION: '(.*)'.*/\1/")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      # 根据分支设置版本号后缀
      - name: Set version suffix
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "VERSION_TAG=${{ env.VERSION }}-test" >> $GITHUB_ENV
          else
            echo "VERSION_TAG=${{ env.VERSION }}" >> $GITHUB_ENV
          fi

      # ✅ 先登录，再初始化 Buildx，避免拉取 BuildKit 镜像时触发匿名限速
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.repository == 'huangxd-/danmu_api'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 登录后手动拉取，绕过匿名限速
      - name: Pull BuildKit image
        if: github.event_name == 'push' && github.repository == 'huangxd-/danmu_api'
        run: docker pull moby/buildkit:buildx-stable-1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          # QEMU 10.2.3 can intermittently SIGILL during Node 22 Alpine npm installs.
          image: docker.io/tonistiigi/binfmt:qemu-v9.2.2-52
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push Docker image
        if: github.event_name == 'push' && github.repository == 'huangxd-/danmu_api'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.DOCKER_USERNAME }}/danmu-api:${{ env.VERSION_TAG }} \
            -t ${{ secrets.DOCKER_USERNAME }}/danmu-api:latest \
            --push .
