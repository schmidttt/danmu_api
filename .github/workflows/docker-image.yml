name: Build and Push Docker Image to Docker Hub

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # PRs validate the image without secrets. Publishing is limited to upstream main.
    if: github.event_name != 'push' || github.repository == 'huangxd-/danmu_api'
    runs-on: ubuntu-latest

    steps:
      # 检出代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 从 danmu_api/configs/globals.js 中读取版本号
      - name: Read version from globals.js
        id: version
        run: |
          VERSION=$(grep "VERSION:" danmu_api/configs/globals.js | sed -E "s/.*VERSION: '(.*)'.*/\1/")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
      # 根据分支设置版本号后缀
      - name: Set version suffix
        run: |
          if [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "VERSION_TAG=${{ env.VERSION }}-test" >> $GITHUB_ENV
          else
            echo "VERSION_TAG=${{ env.VERSION }}" >> $GITHUB_ENV
          fi

      # ✅ 先登录，再初始化 Buildx，避免拉取 BuildKit 镜像时触发匿名限速
      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.repository == 'huangxd-/danmu_api'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 登录后手动拉取，绕过匿名限速
      - name: Pull BuildKit image
        if: github.event_name == 'push' && github.repository == 'huangxd-/danmu_api'
        run: docker pull moby/buildkit:buildx-stable-1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PR 构建不登录、不推送，避免 fork 因无法读取 secrets 而失败
      - name: Build Docker image without publishing
        if: github.event_name != 'push'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t danmu-api:${{ env.VERSION_TAG }} \
            --output=type=oci,dest=/tmp/danmu-api.tar .

      - name: Build and Push Docker image
        if: github.event_name == 'push' && github.repository == 'huangxd-/danmu_api'
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ secrets.DOCKER_USERNAME }}/danmu-api:${{ env.VERSION_TAG }} \
            -t ${{ secrets.DOCKER_USERNAME }}/danmu-api:latest \
            --push .
