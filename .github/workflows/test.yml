name: Test

# Module tests share .cache state and must run serially. Keep manual dispatch for fork proposals.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run upstream and downstream tests
        run: npm test
      - name: Build and smoke-test standalone Forward widget
        run: |
          npm run build-forward-widget
          node --test forward/bundle-smoke.test.js
